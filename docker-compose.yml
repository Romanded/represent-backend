services:
  db:
    container_name: cockroachdb
    image: cockroachdb/cockroach:v24.3.29
    restart: always
    environment:
      - COCKROACH_USER=${COCKROACH_USER}
      - COCKROACH_PASSWORD=${COCKROACH_PASSWORD}
    ports:
      - 26257:26257
      - 8080:8080
    command: start-single-node --insecure
    volumes:
      - cockroach_data:/var/lib/cockroachdb/data
    networks:
      - backend

volumes:
  cockroach_data:

networks:
  backend:
